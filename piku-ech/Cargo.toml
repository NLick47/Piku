[package]
name = "piku_ech"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib 只为主机侧 example/测试能链接进来，发布产物仍是 cdylib
crate-type = ["cdylib", "rlib"]

[dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
ring = "0.17"
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
jni = "0.21"

[dev-dependencies]
webpki-roots = "=1.0.9"
x25519-dalek = "2"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
