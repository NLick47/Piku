[package]
name = "piku_ech"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib 只为主机侧 example/测试能链接进来，发布产物仍是 cdylib
crate-type = ["cdylib", "rlib"]

[dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
ring = "0.17"
webpki-roots = "1"
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
jni = "0.21"

[dev-dependencies]
# 只用于按 RFC 9180 向量校验 KEM 派生（ring 不暴露临时私钥，测试里自己算 DH）
x25519-dalek = "2"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
# panic 一律 abort：unwind 表（.eh_frame + 异常表）占 .so 两成体积，实测 -415KB。
# JNI 边界输入已逐项校验，catch_unwind 只对显式 unwind 构建有意义
panic = "abort"
