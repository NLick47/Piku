name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > piku-keystore.jks
          if [ ! -s piku-keystore.jks ]; then
            echo "::error::无法解码 keystore，请检查 ANDROID_KEYSTORE_BASE64 secret：内容须为 piku-keystore.jks 的 base64（无换行、无空格、无多余字符）"
            exit 1
          fi
          file piku-keystore.jks

      - name: Write signing properties
        run: |
          cat >> local.properties <<EOF
          piku.keystore.path=$PWD/piku-keystore.jks
          piku.keystore.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          piku.key.alias=${{ secrets.ANDROID_KEY_ALIAS }}
          piku.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew :piku:assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::未找到 apksigner"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs piku/build/outputs/apk/release/piku-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piku-release-apk
          path: piku/build/outputs/apk/release/piku-release.apk
          if-no-files-found: error